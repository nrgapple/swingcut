[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swingcut"
version = "0.1.0"
description = "Local-first golf swing video editor for macOS"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Swingcut" }]
dependencies = [
  "google-genai>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
analysis = [
  "mediapipe>=0.10,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
swingcut = "swingcut.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"

[tool.coverage.run]
source = ["swingcut"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["swingcut"]
